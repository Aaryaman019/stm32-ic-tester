<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#DC2626"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#059669"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D97706"/></marker>
    <marker id="aK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .t  { fill:#0F172A; }
      .s  { fill:#475569; font-size:13px; }
      .xs { fill:#64748B; font-size:11.5px; }
      .h  { font-size:17px; font-weight:700; fill:#0F172A; }
      .cap{ font-size:12px; font-weight:700; letter-spacing:1.4px; }
      .box{ fill:#FFFFFF; stroke:#CBD5E1; stroke-width:1.5; }
      .mono{ font-family:'DejaVu Sans Mono', Consolas, monospace; font-size:12.5px; fill:#1E3A8A; font-weight:700; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="40" y="52" class="t" font-size="28" font-weight="800">IC VISION — System Architecture</text>
  <text x="40" y="80" class="s" font-size="15">Counterfeit / faulty 74HC logic IC tester · Final score = 0.8 × Electrical + 0.2 × Visual</text>

  <!-- Containers -->
  <rect x="40"   y="110" width="360" height="710" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="62" y="138" class="cap" fill="#475569">SENSING</text>
  <rect x="440"  y="110" width="640" height="710" rx="14" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="462" y="138" class="cap" fill="#1D4ED8">ELECTRICAL TEST HARDWARE · 80%</text>
  <rect x="1120" y="110" width="440" height="710" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="1142" y="138" class="cap" fill="#475569">DASHBOARD (PC)</text>

  <!-- ============ Column A: DUT + camera ============ -->
  <rect x="70" y="160" width="300" height="340" rx="10" class="box"/>
  <text x="90" y="188" class="h">Device under test</text>
  <text x="90" y="207" class="xs">14-pin DIP in ZIF socket · runs at 3.3 V</text>
  <!-- DIP body -->
  <g>
    <rect x="160" y="222" width="120" height="230" rx="6" fill="#1E293B"/>
    <path d="M205,222 a15,15 0 0 0 30,0" fill="#F8FAFC"/>
    <text x="220" y="330" fill="#E2E8F0" font-size="14" font-weight="700" text-anchor="middle">74HCxx</text>
    <text x="220" y="350" fill="#94A3B8" font-size="11" text-anchor="middle">DUT</text>
    <!-- left pins 1-7 -->
    <g fill="#94A3B8">
      <rect x="146" y="234" width="14" height="10"/><rect x="146" y="264" width="14" height="10"/><rect x="146" y="294" width="14" height="10"/>
      <rect x="146" y="324" width="14" height="10"/><rect x="146" y="354" width="14" height="10"/><rect x="146" y="384" width="14" height="10"/>
      <rect x="146" y="414" width="14" height="10"/>
      <rect x="280" y="234" width="14" height="10"/><rect x="280" y="264" width="14" height="10"/><rect x="280" y="294" width="14" height="10"/>
      <rect x="280" y="324" width="14" height="10"/><rect x="280" y="354" width="14" height="10"/><rect x="280" y="384" width="14" height="10"/>
      <rect x="280" y="414" width="14" height="10"/>
    </g>
    <g class="xs" text-anchor="end">
      <text x="140" y="243">1</text><text x="140" y="273">2</text><text x="140" y="303">3</text><text x="140" y="333">4</text>
      <text x="140" y="363">5</text><text x="140" y="393">6</text><text x="140" y="423" fill="#0F172A" font-weight="700">7 GND</text>
    </g>
    <g class="xs">
      <text x="300" y="243" fill="#DC2626" font-weight="700">14 VCC</text><text x="300" y="273">13</text><text x="300" y="303">12</text>
      <text x="300" y="333">11</text><text x="300" y="363">10</text><text x="300" y="393">9</text><text x="300" y="423">8</text>
    </g>
  </g>
  <text x="90" y="478" class="xs">7400 · 02 · 04 · 08 · 10 · 11 · 27 · 32 · 86</text>

  <rect x="70" y="580" width="300" height="200" rx="10" class="box"/>
  <!-- camera icon -->
  <g transform="translate(92,604)">
    <rect x="0" y="8" width="46" height="32" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
    <rect x="12" y="2" width="16" height="8" rx="2" fill="#D97706"/>
    <circle cx="23" cy="24" r="9" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8"/>
  </g>
  <text x="152" y="628" class="h">Camera</text>
  <text x="152" y="647" class="xs">Top view of the IC</text>
  <text x="92" y="684" class="s">Captures:</text>
  <text x="92" y="706" class="s">• Part marking / logo / date code</text>
  <text x="92" y="728" class="s">• Package surface &amp; resurfacing</text>
  <text x="92" y="750" class="s">• Pin condition (bent / oxidised)</text>
  <line x1="220" y1="580" x2="220" y2="508" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#aA)"/>
  <text x="228" y="548" class="xs" fill="#B45309">views</text>

  <!-- ============ Column B: hardware ============ -->
  <!-- series resistors -->
  <rect x="470" y="200" width="112" height="250" rx="10" class="box"/>
  <text x="526" y="226" text-anchor="middle" font-size="15" font-weight="700" class="t">1 kΩ × 12</text>
  <text x="526" y="244" text-anchor="middle" class="xs">series per pin</text>
  <g stroke="#2563EB" stroke-width="2" fill="none">
    <path d="M490,280 h10 l4,-7 l8,14 l8,-14 l8,14 l8,-14 l4,7 h22"/>
    <path d="M490,320 h10 l4,-7 l8,14 l8,-14 l8,14 l8,-14 l4,7 h22"/>
    <path d="M490,360 h10 l4,-7 l8,14 l8,-14 l8,14 l8,-14 l4,7 h22"/>
  </g>
  <text x="526" y="398" text-anchor="middle" class="xs" fill="#1D4ED8" font-weight="700">drive ⇄ sense</text>
  <text x="526" y="416" text-anchor="middle" class="xs">limits contention</text>
  <text x="526" y="432" text-anchor="middle" class="xs">to ~3.3 mA / pin</text>

  <!-- DUT -> resistors bundle -->
  <g stroke="#2563EB" stroke-width="2">
    <line x1="370" y1="280" x2="470" y2="280"/><line x1="370" y1="320" x2="470" y2="320"/><line x1="370" y1="360" x2="470" y2="360"/>
  </g>
  <!-- resistors -> MCU -->
  <g stroke="#2563EB" stroke-width="2">
    <line x1="582" y1="280" x2="620" y2="280"/><line x1="582" y1="320" x2="620" y2="320"/><line x1="582" y1="360" x2="620" y2="360"/>
  </g>

  <!-- STM32 -->
  <rect x="620" y="170" width="430" height="400" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="642" y="200" class="h" font-size="18">STM32F401RE · NUCLEO-64</text>
  <text x="642" y="219" class="xs">Cortex-M4F 84 MHz · 12-bit ADC · VREFINT-calibrated</text>
  <g>
    <text x="642" y="252" class="mono">PA, PB0, PC0–3</text><text x="790" y="252" class="s">GPIO + ADC · DUT pins 1–4, 6, 8, 10–13</text>
    <text x="642" y="278" class="mono">PA10, PB5</text><text x="790" y="278" class="s">GPIO · DUT pins 5, 9</text>
    <text x="642" y="304" class="mono">PB8 / PB9</text><text x="790" y="304" class="s">I²C1 · INA219 + OLED</text>
    <text x="642" y="330" class="mono">PA8 / PB6</text><text x="790" y="330" class="s">PASS / FAIL LEDs · PB10 buzzer</text>
    <text x="642" y="356" class="mono">PA9 / PC13 / PB4</text><text x="790" y="356" class="s">SELECT / RUN / MANUAL buttons</text>
    <text x="642" y="382" class="mono">PA2 / PA3</text><text x="790" y="382" class="s">USART2 → ST-Link VCP · JSON lines</text>
  </g>
  <line x1="642" y1="404" x2="1030" y2="404" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="642" y="428" class="cap" fill="#1D4ED8" font-size="11">FIRMWARE TEST SEQUENCE</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="640" y="442" width="72" height="62" rx="7" fill="#DBEAFE"/>
    <text x="676" y="469" class="t" font-weight="700">Power</text><text x="676" y="485" class="t">guard</text>
    <rect x="719.5" y="442" width="72" height="62" rx="7" fill="#DBEAFE"/>
    <text x="755.5" y="469" class="t" font-weight="700">Truth</text><text x="755.5" y="485" class="t">table</text>
    <rect x="799" y="442" width="72" height="62" rx="7" fill="#DBEAFE"/>
    <text x="835" y="469" class="t" font-weight="700">Pin</text><text x="835" y="485" class="t">integrity</text>
    <rect x="878.5" y="442" width="72" height="62" rx="7" fill="#DBEAFE"/>
    <text x="914.5" y="469" class="t" font-weight="700">IDD</text><text x="914.5" y="485" class="t">check</text>
    <rect x="958" y="442" width="72" height="62" rx="7" fill="#2563EB"/>
    <text x="994" y="469" fill="#FFFFFF" font-weight="700">Score</text><text x="994" y="485" fill="#FFFFFF">+ JSON</text>
  </g>
  <g fill="#2563EB"><path d="M713,469 l5,4 l-5,4z"/><path d="M792.5,469 l5,4 l-5,4z"/><path d="M872,469 l5,4 l-5,4z"/><path d="M951.5,469 l5,4 l-5,4z"/></g>
  <text x="642" y="530" class="xs">Abort &gt; 40 mA · every vector reads all outputs · pull-up/down hold test</text>
  <text x="642" y="548" class="xs">Wrong part → auto-identify what the chip behaves like (looks_like)</text>

  <!-- power row -->
  <rect x="470" y="610" width="180" height="84" rx="10" class="box"/>
  <text x="488" y="636" class="t" font-size="15" font-weight="700">INA219</text>
  <text x="488" y="656" class="xs">supply current + VCC</text>
  <text x="488" y="674" class="xs">0.05 mA LSB · I²C 0x40</text>
  <rect x="690" y="610" width="160" height="84" rx="10" class="box"/>
  <text x="708" y="636" class="t" font-size="15" font-weight="700">DUT supply</text>
  <text x="708" y="656" class="xs">always on (no relay)</text>
  <text x="708" y="674" class="xs">3V3 → INA219 → pin 14</text>
  <!-- 3V3 from MCU -> relay -> INA -> DUT pin 14 -->
  <path d="M900,570 V652 H850" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#aR)"/>
  <text x="908" y="600" class="xs" fill="#DC2626" font-weight="700">3V3</text>
  <line x1="690" y1="652" x2="650" y2="652" stroke="#DC2626" stroke-width="2.2" marker-end="url(#aR)"/>
  <path d="M470,652 H420 V238 H370" fill="none" stroke="#DC2626" stroke-width="2.2" marker-end="url(#aR)"/>
  <text x="414" y="560" class="xs" fill="#DC2626" font-weight="700" text-anchor="end" transform="rotate(-90 414 560)">VCC → pin 14</text>
  <!-- PB14 relay control -->
  <text x="778" y="594" class="xs"></text>
  <!-- I2C to INA -->
  <line x1="636" y1="570" x2="636" y2="608" stroke="#059669" stroke-width="2.2" marker-end="url(#aG)"/>
  <text x="644" y="594" class="xs" fill="#059669" font-weight="700">I²C</text>

  <!-- UI row -->
  <rect x="690" y="732" width="360" height="66" rx="10" class="box"/>
  <text x="708" y="757" class="t" font-size="15" font-weight="700">Local UI</text>
  <text x="708" y="778" class="xs">SSD1306 OLED · SELECT / RUN / MANUAL · buzzer · LEDs</text>
  <line x1="1000" y1="570" x2="1000" y2="730" stroke="#059669" stroke-width="2.2" marker-end="url(#aG)"/>
  <text x="1008" y="660" class="xs" fill="#059669" font-weight="700">I²C + GPIO</text>
  <rect x="470" y="732" width="180" height="66" rx="10" fill="#FFFFFF" stroke="#BFDBFE" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="488" y="757" class="xs" font-weight="700" fill="#1D4ED8">DUT at 3.3 V</text>
  <text x="488" y="775" class="xs">no dividers / level shifters</text>
  <text x="488" y="790" class="xs">every pin ADC-readable</text>

  <!-- ============ Column C: dashboard ============ -->
  <rect x="1150" y="168" width="380" height="76" rx="10" class="box"/>
  <text x="1170" y="196" class="t" font-size="15" font-weight="700">Serial reader</text>
  <text x="1170" y="216" class="xs">USB serial 115200 · one JSON object per line</text>
  <text x="1170" y="233" class="xs">cmds: test · identify · meter · live · manual · list</text>

  <!-- USB link -->
  <line x1="1050" y1="196" x2="1148" y2="196" stroke="#2563EB" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1085" y="188" text-anchor="middle" class="xs" fill="#1D4ED8" font-weight="700">results</text>
  <line x1="1150" y1="226" x2="1052" y2="226" stroke="#475569" stroke-width="1.8" marker-end="url(#aK)"/>
  <text x="1085" y="243" text-anchor="middle" class="xs">commands</text>

  <rect x="1150" y="282" width="380" height="110" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="1170" y="310" class="t" font-size="15" font-weight="700">Electrical scoring model</text>
  <text x="1170" y="331" class="xs">inputs: per-gate vectors, output volts, H/L/X,</text>
  <text x="1170" y="348" class="xs">pin integrity, IDD, crosstalk</text>
  <text x="1170" y="374" class="s" fill="#1D4ED8" font-weight="700">→ E score (0–100)</text>
  <line x1="1340" y1="244" x2="1340" y2="280" stroke="#2563EB" stroke-width="2.2" marker-end="url(#aB)"/>

  <rect x="1150" y="452" width="380" height="128" rx="10" fill="#0F172A"/>
  <text x="1170" y="482" fill="#FFFFFF" font-size="15" font-weight="700">Score fusion &amp; verdict</text>
  <text x="1170" y="514" fill="#FFFFFF" font-size="19" font-weight="800">Final = 0.8·E + 0.2·V</text>
  <text x="1170" y="542" fill="#CBD5E1" font-size="12.5">PASS · MARGINAL · FAIL · NO_IC</text>
  <text x="1170" y="562" fill="#CBD5E1" font-size="12.5">+ marking mismatch (claimed vs looks_like)</text>
  <line x1="1340" y1="392" x2="1340" y2="450" stroke="#2563EB" stroke-width="2.2" marker-end="url(#aB)"/>
  <text x="1350" y="426" class="xs" fill="#1D4ED8" font-weight="700">× 0.8</text>

  <rect x="1150" y="652" width="380" height="128" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="1170" y="680" class="t" font-size="15" font-weight="700">Visual model</text>
  <text x="1170" y="701" class="xs">marking OCR vs datasheet · logo / font check</text>
  <text x="1170" y="718" class="xs">surface &amp; pin condition</text>
  <text x="1170" y="752" class="s" fill="#B45309" font-weight="700">→ V score (0–100)</text>
  <line x1="1340" y1="652" x2="1340" y2="582" stroke="#D97706" stroke-width="2.2" marker-end="url(#aA)"/>
  <text x="1350" y="622" class="xs" fill="#B45309" font-weight="700">× 0.2</text>

  <!-- camera -> visual model (routed under hardware) -->
  <path d="M220,780 V862 H1136 V716 H1148" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#aA)"/>
  <text x="760" y="854" text-anchor="middle" class="xs" fill="#B45309" font-weight="700">image frames → dashboard (visual path · 20%)</text>

  <!-- legend -->
  <g font-size="11.5" fill="#475569">
    <line x1="1150" y1="806" x2="1172" y2="806" stroke="#2563EB" stroke-width="2.2"/><text x="1178" y="810">signal / data</text>
    <line x1="1262" y1="806" x2="1284" y2="806" stroke="#DC2626" stroke-width="2.2"/><text x="1290" y="810">power</text>
    <line x1="1340" y1="806" x2="1362" y2="806" stroke="#059669" stroke-width="2.2"/><text x="1368" y="810">I²C</text>
    <line x1="1404" y1="806" x2="1426" y2="806" stroke="#D97706" stroke-width="2.2"/><text x="1432" y="810">visual</text>
  </g>
</svg>
